name: Nachtcalendar

on:
  push:
    branches: [master, main]
    paths:
      - "nachtcalendar/**"
      - ".github/workflows/nachtcalendar.yml"
      - "render.yaml"
  pull_request:
    paths:
      - "nachtcalendar/**"
      - ".github/workflows/nachtcalendar.yml"
      - "render.yaml"
  workflow_dispatch:

defaults:
  run:
    working-directory: nachtcalendar

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nachtcalendar/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint / typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build check
        run: npm run build
