name: Deploy naar GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static export supports no Route Handlers — keep API for server deploys only
      - name: Exclude API routes for static export
        run: |
          if [ -d src/app/api ]; then
            mkdir -p .static-exclude
            mv src/app/api .static-exclude/api
          fi

      - name: Build static site
        run: npm run build:pages
        env:
          # Zonder basePath wanneer een eigen domein is ingesteld in GitHub Pages
          GITHUB_PAGES: ${{ vars.CUSTOM_DOMAIN == '' && 'true' || '' }}
          # Optioneel: backend met API-routes (bijv. Render) voor jurisprudentie-zoeken
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
