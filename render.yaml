services:
  - type: web
    name: beleidsdashboard-openraadsinformatie
    runtime: static
    plan: free
    buildCommand: npm install && STATIC_EXPORT=true npm run build
    staticPublishPath: out
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate

  # Dynamisch ICS-abonnement (Schemer en Nacht) — Node, geen Cloudflare nodig
  - type: web
    name: nachtcalendar
    runtime: node
    plan: free
    region: frankfurt
    rootDir: nachtcalendar
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    buildFilter:
      paths:
        - nachtcalendar/**
    envVars:
      - key: NODE_VERSION
        value: "22"
